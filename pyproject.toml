[project]
name = "ia-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShayanKhan0", email = "shahim.malik5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langfuse>=4.15.1",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.4.11",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "import-linter>=2.2.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-postgresql>=9.1.0",
    "ruff>=0.16.6",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
# Registered so that 0.5's CI can run `pytest -m isolation --strict-markers`,
# which hard-errors on an unregistered marker. Registration also turns a
# misspelled marker into a collection error instead of a silent zero-test run.
markers = [
  "isolation: tenant isolation guarantee tests",
  "eval: golden-set evaluation tests",
]
# The isolation tests are async and carry only @pytest.mark.isolation, so
# pytest-asyncio has to adopt them without an explicit @pytest.mark.asyncio.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `package = false` means there is no installed distribution; the repo root has
# to be importable for `src.db.migrate` to resolve from a test.
pythonpath = ["."]

[tool.mypy]
# `package = false` and the flat src/ layout mean src/ is a namespace package, so
# mypy would otherwise resolve src/db/migrate.py as both `db.migrate` and
# `src.db.migrate`. The runbook's own commands are `python -m src.db.migrate`,
# so the repo root is the package base.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# Neither ships a py.typed marker.
module = ["asyncpg.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.lint-imports]
# Enforce that only src.db.session may import asyncpg directly for application code.
# Interpretation: module-level granularity. The "pool" lives in src.db.session as a module-level
# variable. Application modules may not import asyncpg; infrastructure modules (bootstrap_roles,
# migrate) are allowed direct asyncpg connections for setup purposes.
# This prevents accidental direct connection creation in application code outside the session
# context manager, where is_local=true would not protect against tenant context leakage.
root_package = "src"

[[tool.lint-imports.contracts]]
name = "forbid-direct-asyncpg-access"
type = "forbidden"
source_modules = ["src.api", "src.auth", "src.chunking", "src.generate", "src.ingest", "src.llm", "src.orchestrate", "src.retrieval", "src.telemetry"]
target_modules = ["asyncpg"]
